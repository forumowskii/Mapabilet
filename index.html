<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RegioPomorskie Ultimate PRO v10.2</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/photoswipe@5.4.3/dist/photoswipe.css">

    <style>
        :root {
            --accent: #818cf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #facc15;
            --ic-blue: #3b82f6;
            --skm-yellow: #fde047;
            --regio-red: #ef4444;
            --bg-dark: #05070a;
            --glass: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 85px 20px 30px 20px;
        }

        /* MENU BOCZNE */
        .menu-trigger {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1100;
            font-size: 26px;
            cursor: pointer;
            background: var(--glass);
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 15px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 280px;
            height: 100%;
            background: #0f172a;
            z-index: 1200;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 20px;
            border-right: 1px solid var(--accent);
            box-shadow: 20px 0 40px rgba(0,0,0,0.6);
        }

        .side-menu.active { left: 0; }

        .menu-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1150;
            display: none;
            backdrop-filter: blur(5px);
        }

        .menu-overlay.active { display: block; }

        .menu-item {
            padding: 16px;
            margin-bottom: 12px;
            border-radius: 16px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .menu-item:hover {
            background: rgba(129, 140, 248, 0.2);
            border-color: var(--accent);
            transform: translateX(8px);
        }

        /* KARTY */
        .card {
            background: var(--glass);
            padding: 20px;
            border-radius: 28px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        #earned-val {
            font-size: 54px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(to bottom, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 5px 0;
            letter-spacing: -3px;
        }

        .progress-container {
            background: rgba(0, 0, 0, 0.5);
            height: 14px;
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }

        #bar-fill {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            height: 100%; width: 0%;
            transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--accent);
        }

        /* PRZEWOŹNICY */
        .type-switcher {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 5px;
        }

        .type-btn {
            padding: 12px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.4;
            transition: 0.3s;
            text-align: center;
            color: white;
        }

        .type-btn.active { opacity: 1; transform: translateY(-2px); }
        .type-regio { background: var(--regio-red); border-color: #ff7676; }
        .type-ic { background: var(--ic-blue); border-color: #70aaff; }
        .type-skm { background: var(--skm-yellow); color: #000; border-color: #fffb00; }

        /* FORMULARZE */
        input, select, button {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input:focus { border-color: var(--accent); background: rgba(30, 41, 59, 1); }

        .primary-btn { background: var(--accent); font-weight: 800; border: none; cursor: pointer; }
        .success-btn { background: var(--success); font-weight: 900; border: none; cursor: pointer; }

        /* MODALE */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #05070a;
            z-index: 1300;
            flex-direction: column;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 60vh;
            background: var(--bg-dark);
            border-radius: 26px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        svg { width: 100%; height: 100%; touch-action: none; }

        .history-item {
            background: rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 22px;
            border-left: 5px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        #coord-info {
            position: absolute;
            background: var(--warning);
            color: #000;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 900;
            display: none;
            z-index: 4000;
        }
    </style>
</head>
<body>

    <div id="coord-info">X: 0, Y: 0</div>

    <div class="menu-trigger" onclick="window.toggleMenu()">☰</div>
    <div class="menu-overlay" id="menu-overlay" onclick="window.toggleMenu()"></div>
    
    <nav class="side-menu" id="side-menu">
        <h2 style="font-weight: 900; color: var(--accent); margin-bottom: 30px;">MENU</h2>
        <div class="menu-item" onclick="window.closeMenu();">🏠 Pulpit Główny</div>
        <div class="menu-item" onclick="window.openGallery();">🖼️ Schematy Map</div>
        <div class="menu-item" onclick="window.openSettings();">⚙️ Baza Stacji</div>
        <div style="position: absolute; bottom: 20px; opacity: 0.3; font-size: 10px;">v10.2 PRO Build</div>
    </nav>

    <div class="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0; font-weight: 900; padding-left: 55px;">RegioPomorskie</h2>
            <div style="background: var(--success); padding: 5px 12px; border-radius: 20px; font-size: 10px; font-weight: 900;">ONLINE</div>
        </header>

        <section class="card">
            <div style="display: flex; justify-content: space-between; font-size: 11px; opacity: 0.5; font-weight: 800;">
                <span>CEL: 150 ZŁ</span>
                <span id="percentage-label">0%</span>
            </div>
            <div class="progress-container">
                <div id="bar-fill"></div>
            </div>
            <div id="earned-val">0.00 zł</div>
        </section>

        <div class="type-switcher">
            <div class="type-btn type-regio active" id="btn-regio" onclick="window.setType('regio')">REGIO</div>
            <div class="type-btn type-ic" id="btn-ic" onclick="window.setType('ic')">IC</div>
            <div class="type-btn type-skm" id="btn-skm" onclick="window.setType('skm')">SKM</div>
        </div>

        <section class="card">
            <div style="display: grid; gap: 10px;">
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="route-from" placeholder="Z..." list="stations-list">
                    <input type="text" id="route-to" placeholder="Do..." list="stations-list">
                </div>
                <datalist id="stations-list"></datalist>

                <div style="display: flex; gap: 5px;">
                    <input type="text" id="regio-num" placeholder="Nr pociągu" style="flex:2">
                    <button onclick="window.checkStops()" style="flex:0.5; background:var(--warning); color:#000; font-weight:900">?</button>
                </div>

                <div style="display: flex; gap: 5px;">
                    <select id="discount-select" style="flex:1.5">
                        <option value="0.37">Uczeń (37%)</option>
                        <option value="0.51">Student (51%)</option>
                        <option value="0">Normalny</option>
                    </select>
                    <input type="number" id="trip-amount" placeholder="Cena zł" style="flex:1; color:var(--success); font-weight:800">
                </div>

                <div style="display: flex; gap: 5px;">
                    <button onclick="window.calculatePrice()" class="primary-btn">OBLICZ</button>
                    <button onclick="window.addNewTrip()" class="success-btn">ZAPISZ</button>
                </div>
                <div id="stop-info" style="font-size: 10px; color: var(--accent); text-align: center; font-weight: 700;"></div>
            </div>
        </section>

        <div style="display: flex; gap: 10px;">
            <button onclick="window.openMap()" style="background:#1e293b; font-weight:700">🗺️ EDYTOR SIECI</button>
            <button onclick="window.openHeatmap()" style="background:#1e1b4b; font-weight:700">🔥 NATĘŻENIE</button>
        </div>

        <h3 style="font-size: 12px; opacity: 0.4; margin: 10px 0 0 5px;">OSTATNIE PRZEJAZDY</h3>
        <div id="history-list"></div>
    </div>

    <div id="map-modal" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0">🗺️ Kreator Sieci</h3>
            <div style="display:flex; gap:5px;">
                <button onclick="window.toggleGrid()" id="grid-btn" style="width:auto; padding:5px 10px; font-size:10px;">GRID: OFF</button>
                <button onclick="window.closeMap()" style="background:var(--danger); width:auto; padding:5px 15px;">X</button>
            </div>
        </div>
        <div class="map-wrapper"><svg id="svg-map" viewBox="0 0 400 600"></svg></div>
        <div style="margin-top:10px; display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
            <input type="text" id="new-st-name" placeholder="Nazwa stacji" style="grid-column: span 2">
            <select id="new-st-type">
                <option value="regio">Typ: Regio</option>
                <option value="ic">Typ: IC</option>
                <option value="skm">Typ: SKM</option>
            </select>
            <input type="number" id="new-st-km" placeholder="KM">
            <input type="number" id="new-st-x" placeholder="Poz X">
            <input type="number" id="new-st-y" placeholder="Poz Y">
            <input type="text" id="new-st-parent" placeholder="ID Poprzedniej" style="grid-column: span 2">
            <button onclick="window.saveNewStation()" class="success-btn" style="grid-column: span 2">DODAJ DO BAZY</button>
        </div>
    </div>

    <div id="heatmap-modal" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3 style="margin:0">🔥 Natężenie</h3>
            <button onclick="window.closeHeatmap()" style="background:var(--danger); width:auto; padding:5px 20px;">ZAMKNIJ</button>
        </div>
        <div class="map-wrapper"><svg id="svg-heatmap" viewBox="0 0 400 600"></svg></div>
    </div>

    <div id="gallery-modal" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0">🖼️ Schematy PNG</h3>
            <button onclick="window.closeGallery()" style="background:var(--danger); width:auto; padding:5px 20px;">X</button>
        </div>
        <div id="gallery-list" style="overflow-y:auto; flex:1;">
            <img src="img/schemat1.jpg" style="width:100%; border-radius:15px; margin-bottom:10px; border:1px solid var(--border);" onclick="window.fullView(0)">
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3 style="margin:0">⚙️ Baza Stacji</h3>
            <button onclick="window.closeSettings()" style="background:var(--danger); width:auto; padding:5px 20px;">X</button>
        </div>
        <input type="text" id="station-search" placeholder="Szukaj stacji..." oninput="window.filterStations()">
        <div id="full-station-grid" style="overflow-y:auto; flex:1; margin-top:10px; display:grid; gap:10px;"></div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>

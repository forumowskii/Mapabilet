<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilet Tracker Pro v8.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #818cf8;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #facc15;
            --bg-dark: #0b0f1a;
            --glass: rgba(30, 41, 59, 0.7);
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #4c1d95 100%);
            background-attachment: fixed;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
            min-height: 100vh; overflow-x: hidden;
        }

        .app-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }

        .card {
            background: var(--glass); padding: 20px; border-radius: 24px;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #earned-val {
            font-size: 48px; font-weight: 900; text-align: center;
            background: linear-gradient(to bottom, #ffffff, #cbd5e1);
            background-clip: text; -webkit-background-clip: text;
            color: transparent; -webkit-text-fill-color: transparent;
            display: block; margin: 10px 0;
        }

        /* Siatka i Mapa */
        #svg-map, #svg-heatmap {
            width: 100%; height: 65vh; background: var(--bg-dark);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: crosshair; touch-action: none;
        }

        .grid-line { stroke: rgba(255,255,255,0.05); stroke-width: 1; }
        .grid-point:hover { fill: var(--warning); r: 4; cursor: pointer; }
        
        .map-link { stroke: #6366f1; stroke-width: 3; stroke-linecap: round; opacity: 0.4; }
        .heatmap-link { stroke-width: 6; stroke-linecap: round; }

        /* Historia (bez kasowania) */
        .history-item {
            background: rgba(255, 255, 255, 0.08); padding: 18px;
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 18px; border-left: 4px solid var(--accent); margin-bottom: 10px;
        }

        input, select, button {
            width: 100%; padding: 15px; border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6); color: white;
            font-size: 15px; outline: none; box-sizing: border-box;
        }

        button { background: var(--accent); font-weight: 800; border: none; cursor: pointer; }
        button:active { transform: scale(0.96); }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; z-index: 1000; flex-direction: column; padding: 20px; box-sizing: border-box;
        }
        .modal.active { display: flex; }

        /* Legenda Heatmapy */
        .legend {
            display: flex; justify-content: center; gap: 15px; margin-top: 15px;
            font-size: 12px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;
        }
        .leg-item { display: flex; align-items: center; gap: 5px; }
        .box { width: 12px; height: 12px; border-radius: 3px; }

        #coord-info {
            position: absolute; background: var(--warning); color: #000;
            padding: 2px 8px; border-radius: 5px; font-size: 12px;
            font-weight: bold; pointer-events: none; display: none; z-index: 1001;
        }
    </style>
</head>
<body>

    <div id="coord-info">X: 0, Y: 0</div>

    <div class="app-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin:0; font-weight: 800;">🚆 Licznik PKP</h2>
            <div style="background: var(--success); padding: 4px 12px; border-radius: 20px; font-size: 11px;">V8.0</div>
        </header>

        <section class="card">
            <div style="display: flex; justify-content: space-between; font-size: 12px; opacity: 0.6;">
                <span>Zysk (Cel: 150 zł)</span>
                <span id="percentage-label">0%</span>
            </div>
            <div id="earned-val">0.00 zł</div>
        </section>

        <div style="display: flex; gap: 10px;">
            <button onclick="window.openMap()" style="background: var(--warning); color: #000; flex: 1;">🗺️ MAPA</button>
            <button onclick="window.openHeatmap()" style="background: #4338ca; flex: 1;">🔥 NATĘŻENIE</button>
            <button onclick="window.openStationList()" style="background: #475569; flex: 1;">📋 BAZA</button>
        </div>

        <section class="card">
            <div style="display: grid; gap: 10px;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="route-from" placeholder="Skąd?" list="stations-list">
                    <input type="text" id="route-to" placeholder="Dokąd?" list="stations-list">
                </div>
                <datalist id="stations-list"></datalist>
                <button onclick="window.calculatePrice()">🧮 OBLICZ KM</button>
                <div style="display: flex; gap: 8px;">
                    <select id="discount-select" style="flex: 1.5;">
                        <option value="0.51">Student (51%)</option>
                        <option value="0">Normalny</option>
                    </select>
                    <input type="number" id="trip-amount" placeholder="Cena" style="flex: 1;">
                </div>
                <button onclick="window.addNewTrip()" style="background: var(--success);">✅ ZAPISZ</button>
                <p id="calc-info" style="text-align:center; font-size:12px; color:var(--accent); margin:0;"></p>
            </div>
        </section>

        <div id="history-list"></div>
    </div>

    <div id="map-modal" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3 style="margin:0">🗺️ Mapa i Edytor</h3>
            <div style="display:flex; gap:10px;">
                <button onclick="window.toggleGrid()" id="grid-btn" style="width:auto; padding:5px 15px; background:#475569;">SIATKA: WYŁ</button>
                <button onclick="window.closeMap()" style="width:auto; background:var(--danger); padding:5px 15px;">X</button>
            </div>
        </div>
        <svg id="svg-map" viewBox="0 0 400 600"></svg>
        <div class="card" style="margin-top:15px; background:rgba(0,0,0,0.4);">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">
                <input type="text" id="new-st-name" placeholder="Nazwa" style="grid-column: span 2;">
                <input type="number" id="new-st-km" placeholder="KM">
                <input type="text" id="new-st-parent" placeholder="Rodzic">
                <input type="number" id="new-st-x" placeholder="Koord X">
                <input type="number" id="new-st-y" placeholder="Koord Y">
                <button onclick="window.saveNewStation()" style="background:var(--success); grid-column: span 2;">DODAJ PUNKT</button>
            </div>
        </div>
    </div>

    <div id="heatmap-modal" class="modal" style="background: #0b0f1a;">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <h3 style="margin:0; color:#fff;">🔥 Natężenie tras</h3>
            <button onclick="window.closeHeatmap()" style="width:auto; background:var(--danger); padding:5px 15px;">Zamknij Mapę X</button>
        </div>
        <div style="flex:1; display:flex; align-items:center; justify-content:center;">
            <div style="width:100%; max-width:350px; background:rgba(30,41,59,0.5); padding:30px; border-radius:20px;">
                <svg id="svg-heatmap" viewBox="0 0 400 600" style="height:50vh; border:none; background:transparent;"></svg>
            </div>
        </div>
        <div class="legend">
            <div class="leg-item"><div class="box" style="background:#475569;"></div> 0</div>
            <div class="leg-item"><div class="box" style="background:#facc15;"></div> 1-4</div>
            <div class="leg-item"><div class="box" style="background:#f97316;"></div> 5-19</div>
            <div class="leg-item"><div class="box" style="background:#ef4444;"></div> 20+</div>
        </div>
    </div>

    <div id="list-modal" class="modal">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <input type="text" id="station-search" placeholder="🔍 Szukaj stacji..." oninput="window.filterStations()">
            <button onclick="window.closeStationList()" style="width:auto; background:var(--danger);">POWRÓT</button>
        </div>
        <div id="full-station-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; overflow-y:auto;"></div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilet Tracker Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Styl dla mapy pełnoekranowej */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal.active { display: flex; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #svg-map { width: 90%; max-width: 500px; height: 60vh; background: #1e293b; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .legend { display: flex; gap: 15px; margin-top: 20px; font-size: 0.8rem; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .color-box { width: 15px; height: 15px; border-radius: 3px; }
        
        .history-list { max-height: 250px; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
        .history-item { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 8px; font-size: 0.85rem; border-left: 4px solid #6366f1; display: flex; justify-content: space-between; align-items: center; }
        .split-btn { display: flex; gap: 10px; }
        .split-btn button { flex: 1; padding: 12px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div class="logo-area">
                <span style="font-size: 1.5rem;">🚆</span>
                <h1 style="display: inline; margin-left: 10px; font-size: 1.2rem;">Licznik Kolejowy</h1>
            </div>
            <div id="connection-status" style="background: rgba(34, 197, 94, 0.2); color: #4ade80; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">
                Online
            </div>
        </header>

        <section class="card progress-card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="opacity: 0.8; font-size: 0.9rem;">Zysk z biletu</span>
                <span id="percentage-label" style="color: #818cf8; font-weight: 800;">0%</span>
            </div>
            <div class="progress-container"><div id="bar-fill"></div></div>
            <div style="display: flex; justify-content: space-between; margin-top: 15px; text-align: center;">
                <div style="flex: 1;">
                    <small style="opacity: 0.6; font-size: 0.7rem;">WYJEŻDŻONE</small>
                    <p id="earned-val" style="font-size: 1.4rem; font-weight: 800; margin: 5px 0;">0.00 zł</p>
                </div>
                <div style="flex: 1;">
                    <small style="opacity: 0.6; font-size: 0.7rem;">KOSZT BILETU</small>
                    <p style="font-size: 1.4rem; font-weight: 800; margin: 5px 0; opacity: 0.5;">150.00 zł</p>
                </div>
            </div>
        </section>

        <section class="card" style="padding: 10px 20px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 0.8rem; opacity: 0.8;">Brak stacji na liście?</span>
                <button onclick="window.promptAddStation()" style="background: #334155; color: white; padding: 5px 10px; font-size: 0.7rem; width: auto; margin: 0;">+ Dodaj do Taryfy</button>
            </div>
        </section>

        <section class="card action-card">
            <h3 style="margin-top: 0; font-size: 1rem; color: #22c55e;">📝 Rejestracja Przejazdu</h3>
            <div style="display: grid; gap: 10px;">
                <input type="text" id="train-nr" placeholder="Nr Pociągu (opcjonalnie)">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label style="font-size:0.7rem; opacity:0.6;">Stacja OD</label>
                        <input type="text" id="route-from" placeholder="np. Gdańsk" list="stations-list">
                    </div>
                    <div>
                        <label style="font-size:0.7rem; opacity:0.6;">Stacja DO</label>
                        <input type="text" id="route-to" placeholder="np. Sopot" list="stations-list">
                    </div>
                </div>

                <datalist id="stations-list"></datalist>

                <div style="display: flex; gap: 10px; align-items: flex-end;">
                    <div style="flex: 1;">
                        <label style="font-size:0.7rem; opacity:0.6;">Zniżka</label>
                        <select id="discount-select" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.2); color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;">
                            <option value="0">Brak (Normalny)</option>
                            <option value="0.25">25%</option>
                            <option value="0.33">33%</option>
                            <option value="0.37">37%</option>
                            <option value="0.49">49%</option>
                            <option value="0.50">50%</option>
                            <option value="0.51">51% (Studencka)</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label style="font-size:0.7rem; opacity:0.6;">Kwota (PLN)</label>
                        <input type="number" id="trip-amount" step="0.10" placeholder="0.00">
                    </div>
                </div>

                <div id="calc-msg" style="font-size: 0.75rem; text-align: center; color: #aaa; margin-bottom: 5px;"></div>

                <div class="split-btn">
                    <button onclick="window.calculatePrice()" style="background: #6366f1; color: white;">🧮 Oblicz cenę</button>
                    <button onclick="window.addNewTripFull()" style="background: #22c55e; color: white;">✅ Dodaj do bazy</button>
                </div>
            </div>
        </section>

        <section class="card">
            <button onclick="window.openMap()" style="background: #facc15; color: #1e293b; font-weight: bold; width: 100%;">🗺️ Otwórz mapę przejazdów (Heatmapa)</button>
        </section>

        <section class="card">
            <h3 style="margin-top: 0; font-size: 1rem; color: #6366f1;">📜 Zapisana Historia</h3>
            <div id="history-list" class="history-list">Ładowanie historii z chmury...</div>
        </section>
    </div>

    <div id="map-modal" class="modal">
        <button class="close-btn" onclick="window.closeMap()">Zamknij Mapę X</button>
        <h2 style="color: white; margin-bottom: 10px;">Natężenie tras</h2>
        
        <svg id="svg-map" viewBox="0 0 200 500">
            </svg>

        <div class="legend" style="color: white;">
            <div class="legend-item"><div class="color-box" style="background: #64748b;"></div> 0</div>
            <div class="legend-item"><div class="color-box" style="background: #f59e0b;"></div> 1-4</div>
            <div class="legend-item"><div class="color-box" style="background: #ea580c;"></div> 5-19</div>
            <div class="legend-item"><div class="color-box" style="background: #dc2626;"></div> 20+</div>
        </div>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
